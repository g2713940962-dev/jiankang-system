server:
  port: 8081

spring:
  application:
    name: jiankang-backend-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jiankang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# JWT 配置
jwt:
  # 密钥需足够长（HS256 至少 32 字节），生产环境请更换
  secret: jiankang-health-checkin-system-secret-key-2026
  # 过期时间（毫秒），默认 7 天
  expire: 604800000
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    com.jiankang: info
